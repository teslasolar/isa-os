# ════════════════════════════════════════════════════════════════════════
# ISA-OS Module Configuration
# Simple key=value format for module loading
# ════════════════════════════════════════════════════════════════════════

[GLOBAL]
auto_load=yes
verbose=yes
fail_on_error=no

[MODULES]
# Load order matters - dependencies first!

# Core services
config_system=enabled
audit=enabled

# L0 Drivers
i2c=enabled
spi=enabled
can_bus=enabled
modbus=enabled
profinet=enabled
ethercat=enabled

# L2 Protocols
opc_ua=enabled
mqtt=enabled

# Future modules (disabled for now)
# usb=disabled
# ethernet=disabled
# tcp_ip=disabled
# http_server=disabled

[DRIVER_CONFIG]
# CAN Bus
can.baudrate=500000
can.loopback=no

# SPI
spi.clock=1000000
spi.mode=0

# I2C
i2c.clock=100000
i2c.addressing=7bit

# Modbus
modbus.baud=9600
modbus.parity=none

[PROTOCOL_CONFIG]
# OPC UA
opcua.port=4840
opcua.security=none
opcua.max_nodes=256

# MQTT
mqtt.broker=mqtt.local
mqtt.port=1883
mqtt.qos=0

[ISA_LEVELS]
L0.cycle_ms=10
L1.scan_ms=5
L2.update_ms=100
L3.batch_engine=isa88
L4.erp_sync_min=60
